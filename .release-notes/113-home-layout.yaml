issue: 113
userVisible: true
text: >-
  Главный экран стал компактнее: выбор человека и основные действия находятся в верхней панели, питомцы доступны в раскрываемом списке, история — также рядом с датой измерения, а показатели графика выбираются в списке с флажками. Карточка и элементы управления адаптируются к узкому экрану и крупному шрифту.
