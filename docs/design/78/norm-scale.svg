<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Макет карточки «Костная масса» с горизонтальной шкалой нормы</title>
  <desc id="desc">Значение 2,70 килограмма относится к недостаточной зоне. Маркер находится на красном участке перед границей 2,90.</desc>
  <rect width="720" height="360" rx="28" fill="#f6f4f8"/>
  <rect x="36" y="36" width="648" height="288" rx="24" fill="#ffffff" stroke="#ded9e1" stroke-width="2"/>
  <text x="72" y="92" font-family="sans-serif" font-size="25" font-weight="500" fill="#242127">Костная масса</text>
  <text x="496" y="92" font-family="sans-serif" font-size="25" font-weight="500" fill="#242127">2,70 кг</text>
  <circle cx="642" cy="82" r="22" fill="none" stroke="#716d76" stroke-width="2"/>
  <text x="638" y="90" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#716d76">i</text>
  <text x="72" y="130" font-family="sans-serif" font-size="18" font-weight="500" fill="#b53432">Недостаточная</text>
  <text x="264" y="190" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#66616a">2,90</text>
  <text x="456" y="190" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#66616a">4,10</text>
  <path d="M72 220 H264" stroke="#e45b55" stroke-width="10" stroke-linecap="round"/>
  <path d="M264 220 H456" stroke="#93c83e" stroke-width="10"/>
  <path d="M456 220 H648" stroke="#2b83d5" stroke-width="10" stroke-linecap="round"/>
  <circle cx="240" cy="220" r="13" fill="#ffffff" stroke="#e45b55" stroke-width="5"/>
  <text x="168" y="270" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#b53432">Недостаточная</text>
  <text x="360" y="270" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#716d76">Нормальная</text>
  <text x="552" y="270" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#716d76">Хорошая</text>
</svg>
