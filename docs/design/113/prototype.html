13v2 .metric{min-width:0}#ss113v2 .label{font-size:.8em;color:var(--ss-muted)}#ss113v2 .value{font-weight:500;font-size:1.1em}#ss113v2 .expand{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ss-primary)}#ss113v2 .expand svg{width:18px;height:18px}#ss113v2 .chartbox{background:white;border-radius:24px;padding:16px;position:relative}#ss113v2 h3{font-weight:500;font-size:1em;margin:0}#ss113v2 .muted{font-size:.8em;color:var(--ss-muted)}#ss113v2 .chart{height:230px;width:100%;display:block;margin-top:8px}#ss113v2 .series-control{position:relative;margin-top:8px}#ss113v2 .series-button{width:100%;display:flex;justify-content:space-between;align-items:center;color:var(--ss-primary);background:#edf5f1}#ss113v2 .dropdown{background:white;border:1px solid #e0e5e2;border-radius:16px;padding:8px;margin-top:6px}#ss113v2 .dropdown label{display:flex;gap:8px;align-items:center;min-height:48px;font-size:.9em}#ss113v2 input{width:20px;height:20px;accent-color:var(--ss-primary)}#ss113v2 .swatch{width:10px;height:10px;border-radius:50%;flex-shrink:0}#ss113v2 nav{display:flex;background:white;border-radius:0 0 24px 24px;padding:10px 8px 12px}#ss113v2 nav button{flex:1;font-size:12px;color:var(--ss-muted);display:flex;flex-direction:column;align-items:center;gap:4px}#ss113v2 nav .navicon{display:flex;align-items:center;justify-content:center;width:64px;height:32px;border-radius:20px}#ss113v2 nav svg{height:24px;width:24px}#ss113v2 nav button:first-child .navicon{background:var(--ss-card);color:#173a34}#ss113v2 .note{font-size:12px;text-align:center;color:#68736f;margin:10px}#ss113v2 .route{background:white;border-radius:16px;padding:12px;margin:0 16px 12px}#ss113v2 [hidden]{display:none!important}@container(max-width:340px){#ss113v2 .metrics{grid-template-columns:1fr}#ss113v2 .top{padding:0 8px}#ss113v2 .profile select{font-size:1em}}
#ss113v2 .shortcut{max-width:100%;overflow-wrap:anywhere}#ss113v2 .phone.large .top{flex-wrap:wrap}#ss113v2 .phone.large .profile{flex-basis:100%}#ss113v2 .phone.large .metrics{grid-template-columns:1fr}#ss113v2 .phone.large nav button{font-size:1em}#ss113v2 .phone.large nav{flex-wrap:wrap}#ss113v2 .row>*{max-width:100%}#ss113v2 .add-pet{color:var(--ss-primary);width:100%;min-height:48px}#ss113v2 .shortcuts:has(.add-pet[hidden]){padding-bottom:0}#ss113v2 .summary{--ss-muted:#4f625c;--ss-primary:#1e6259}</style>
<div class="phone">

<main>
<section class="summary"><div class="row"><span class="time">11 сентября, 08:42</span><button class="card-history" style="color:var(--ss-primary);font-size:.8em">История →</button><button class="icon sync" aria-label="Ошибка синхронизации — подробности"><i data-lucide="triangle-alert" aria-hidden="true"></i></button><button class="icon more" aria-label="Действия с измерением"><i data-lucide="ellipsis-vertical" aria-hidden="true"></i></button></div><div class="weight">72,40 <span class="unit">кг</span></div><div class="weight-only" hidden>Только вес</div><div class="delta">−0,20 кг к предыдущему измерению</div><div class="metrics"><div class="metric"><div class="label">Жир</div><div class="value" data-full="26,2 %">26,2 %</div></div><div class="metric"><div class="label">Мышечная масса</div><div class="value" data-full="48,20 кг">48,20 кг</div></div><div class="metric"><div class="label">Вода</div><div class="value" data-full="51,1 %">51,1 %</div></div><div class="metric"><div class="label">Индекс массы тела</div><div class="value" data-full="23,8">23,8</div></div></div><button class="expand" aria-expanded="false">Все показатели <i data-lucide="chevron-down" aria-hidden="true"></i></button><div class="extra" hidden></div></section>

<script>
(()=>{const root=document.getElementById('ss113v2'),q=s=>root.querySelector(s);const state={width:'412',type:'Полное',pets:'Быстрые переходы',font:'Обычный'};const series=[['Вес','#1a73e8',72.4],['Масса жира','#e53935',19],['Масса воды','#00acc1',37],['Мышечная масса','#43a047',48.2],['Скелетные мышцы','#8e24aa',28],['Костная масса','#fb8c00',2.8],['Масса белка','#d81b60',11],['Безжировая масса','#00897b',53.4]];let active=series.map(()=>true);q('.dropdown').innerHTML=series.map((s,i)=>`<label><input type="checkbox" checked data-i="${i}"><span class="swatch" style="background:${s[1]}"></span>${s[0]}</label>`).join('');function chart(){const svg=q('.chart'),w=svg.clientWidth||348;svg.setAttribute('viewBox',`0 0 ${w} 230`);let html='';for(let y=0;y<=80;y+=20){const py=200-y*2.2;html+=`<line x1="36" x2="${w-8}" y1="${py}" y2="${py}" stroke="#e0e5e2"/><text x="0" y="${py+4}" font-size="12" fill="#68736f">${y}</text>`;}series.forEach((s,i)=>{if(!active[i])return;const pts=Array.from({length:14},(_,j)=>`${36+j*(w-46)/13},${200-(s[2]+Math.sin(j*1.6+i)*.6)*2.2}`).join(' ');html+=`<polyline points="${pts}" fill="none" stroke="${s[1]}" stroke-width="2"/>`;});html+=`<text x="36" y="226" font-size="12" fill="#68736f">29 авг</text><text x="${w-45}" y="226" font-size="12" fill="#68736f">11 сен</text>`;if(!active.some(Boolean))html+=`<text x="${w/2}" y="110" text-anchor="middle" font-size="12" fill="#68736f">Выберите показатели</text>`;svg.innerHTML=html;q('.series-title').textContent=`Показатели · ${active.filter(Boolean).length} из 8`;}
q('.dropdown').onchange=e=>{active[+e.target.dataset.i]=e.target.checked;chart();};q('.series-button').onclick=()=>{q('.dropdown').hidden=!q('.dropdown').hidden;q('.series-button').setAttribute('aria-expanded',!q('.dropdown').hidden);};function route(text){q('.route').hidden=false;q('.route').textContent=text;}let syncPaused=false;q('.pause').onclick=()=>{syncPaused=!syncPaused;q('.pause').setAttribute('aria-pressed',String(syncPaused));q('.pause').setAttribute('aria-label',syncPaused?'Возобновить внешнюю синхронизацию':'Приостановить внешнюю синхронизацию');q('.pause').innerHTML=`<i data-lucide="${syncPaused?'play':'pause'}" aria-hidden="true"></i>`;if(globalThis.lucide)lucide.createIcons();};q('.history').onclick=()=>route('Открывается текущая история выбранного профиля.');q('.queue').onclick=()=>route('Открывается существующая очередь: 2 неназначенных измерения.');q('.sync').onclick=()=>route('Открывается существующий лист синхронизации с причиной ошибки и доступным повтором.');q('.more').onclick=()=>route('Меню измерения: «Изменить», «Удалить» с текущим подтверждением.');root.querySelectorAll('.pet').forEach(b=>b.onclick=()=>route(`Переход в существующий профиль питомца «${b.dataset.name}». Карточка ниже — макет человеческого измерения, экран питомца здесь не перерисован.`));q('.add-pet').onclick=()=>route('Открывается существующий сценарий добавления питомца.');q('.card-history').onclick=()=>route('Открывается текущая история выбранного профиля.');q('select').onchange=()=>route(`Выбран профиль «${q('select').value}». Данные в макете демонстрационные.`);q('.expand').onclick=()=>{const e=q('.extra');e.hidden=!e.hidden;e.textContent='Здесь раскрывается существующий полный набор показателей и справочных оценок. Их состав и правила отображения сохраняются.';q('.expand').setAttribute('aria-expanded',!e.hidden);};let petsExpanded=false;
function layoutPets(){
const row=q('.shortcuts'), toggle=q('.pets-toggle'), pets=Array.from(root.querySelectorAll('.pet'));
const empty=state.pets==='Нет питомцев';
q('.add-pet').hidden=!empty||!petsExpanded;
row.hidden=empty&&!petsExpanded;
pets.forEach(p=>p.hidden=empty);toggle.hidden=false;
toggle.setAttribute('aria-label',petsExpanded?'Свернуть список питомцев':'Развернуть список питомцев');
toggle.setAttribute('aria-expanded',String(petsExpanded));q('.pets-chevron').style.transform=petsExpanded?'rotate(180deg)':'';
if(empty)return;
pets.forEach(p=>p.hidden=false);
const available=row.clientWidth-32, gap=4;
let used=0, fit=0;
const reserve=0;
for(const p of pets){const width=p.getBoundingClientRect().width;if(used+width+(fit?gap:0)+reserve>available)break;used+=width+(fit?gap:0);fit++;}
const total=pets.reduce((sum,p)=>sum+p.getBoundingClientRect().width,0)+gap*(pets.length-1);
if(total<=available){toggle.hidden=true;return;}
pets.forEach((p,i)=>p.hidden=!petsExpanded&&i>=fit);
toggle.setAttribute('aria-label',petsExpanded?'Свернуть список питомцев':'Развернуть список питомцев');
toggle.setAttribute('aria-expanded',String(petsExpanded));q('.pets-chevron').style.transform=petsExpanded?'rotate(180deg)':'';
}
let dragStart=null, dragged=false;
const petHandle=q('.pets-toggle');
petHandle.onclick=()=>{if(dragged){dragged=false;return;}petsExpanded=!petsExpanded;layoutPets();};
petHandle.onpointerdown=e=>{dragStart=e.clientY;dragged=false;petHandle.setPointerCapture(e.pointerId);};
petHandle.onpointerup=e=>{if(dragStart===null)return;const distance=e.clientY-dragStart;dragStart=null;if(Math.abs(distance)>=24){dragged=true;petsExpanded=distance>0;layoutPets();}if(petHandle.hasPointerCapture(e.pointerId))petHandle.releasePointerCapture(e.pointerId);};
petHandle.onpointercancel=()=>{dragStart=null;dragged=false;};
function render(){q('.phone').style.width=state.width+'px';q('.phone').style.fontSize=state.font==='Обычный'?'16px':'32px';q('.phone').classList.toggle('large',state.font!=='Обычный');q('.weight-only').hidden=state.type!=='Только вес';root.querySelectorAll('.value').forEach(v=>v.textContent=state.type==='Только вес'?'—':v.dataset.full);layoutPets();chart();}render();new ResizeObserver(chart).observe(q('.chart'));new ResizeObserver(layoutPets).observe(q('.phone'));if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addSelect(state,'width',{label:'Ширина',options:['412','320']});t.addSelect(state,'type',{label:'Измерение',options:['Полное','Только вес']});t.addSelect(state,'pets',{label:'Питомцы',options:['Быстрые переходы','Нет питомцев']});t.addSelect(state,'font',{label:'Шрифт',options:['Обычный','Крупный']});}})();
</script>
