:root[data-theme=&quot;light&quot;] {

* {

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;scalesync-settings-mockup&#x27;);
  const shell = root.querySelector(&#x27;.device-shell&#x27;);
  const content = root.querySelector(&#x27;.app-content&#x27;);
  const title = root.querySelector(&#x27;.screen-title&#x27;);
  const back = root.querySelector(&#x27;.back-action&#x27;);
  const nav = root.querySelector(&#x27;.bottom-navigation&#x27;);
  const state = { flavor: &#x27;personal&#x27;, data: &#x27;ready&#x27;, screen: &#x27;root&#x27;, width: &#x27;regular&#x27;, textScale: &#x27;normal&#x27; };

  const screens = {
    root: [&#x27;Настройки&#x27;, &#x27;root-screen-template&#x27;],
    profiles: [&#x27;Профили&#x27;, &#x27;profiles-screen-template&#x27;],
    backup: [&#x27;Резервная копия&#x27;, &#x27;backup-screen-template&#x27;],
    diagnostics: [&#x27;Диагностика&#x27;, &#x27;diagnostics-screen-template&#x27;],
    history: [&#x27;История версий&#x27;, &#x27;history-screen-template&#x27;],
    &#x27;scale-detail&#x27;: [&#x27;Весы&#x27;, &#x27;connection-screen-template&#x27;],
    &#x27;health-detail&#x27;: [&#x27;Health Connect&#x27;, &#x27;connection-screen-template&#x27;],
    &#x27;huawei-detail&#x27;: [&#x27;Huawei Health&#x27;, &#x27;connection-screen-template&#x27;]
  };

  function setPressed(selector, value, attribute) {
    root.querySelectorAll(selector).forEach(button =&gt; {
      button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset[attribute] === value));
    });
  }

  function render(focusTarget = null) {
    const [screenTitle, templateId] = screens[state.screen];
    title.textContent = screenTitle;
    content.replaceChildren(root.querySelector(`#${templateId}`).content.cloneNode(true));
    const nested = state.screen !== &#x27;root&#x27;;
    back.hidden = !nested;
    nav.hidden = nested;
    shell.dataset.widthMode = state.width;
    shell.dataset.textScale = state.textScale;

    if (state.screen === &#x27;root&#x27;) {
      const empty = state.data === &#x27;empty&#x27;;
      const rootStatuses = {
        ready: [&#x27;Mi Body Composition Scale 2&#x27;, &#x27;Подключено&#x27;, &#x27;Подключено&#x27;],
        empty: [&#x27;Весы не выбраны&#x27;, &#x27;Требуется разрешение&#x27;, &#x27;Не подключено&#x27;],
        checking: [&#x27;Поиск весов…&#x27;, &#x27;Проверка состояния…&#x27;, &#x27;Проверка состояния…&#x27;],
        disabled: [&#x27;Весы не выбраны&#x27;, &#x27;Отключено в приложении&#x27;, &#x27;Отключено в приложении&#x27;],
        unavailable: [&#x27;Bluetooth недоступен&#x27;, &#x27;Недоступно на устройстве&#x27;, &#x27;Требуется обновление&#x27;],
        error: [&#x27;Не удалось найти весы&#x27;, &#x27;Не удалось проверить&#x27;, &#x27;Не удалось проверить&#x27;]
      };
      const statuses = rootStatuses[state.data];
      content.querySelector(&#x27;.huawei-row&#x27;).hidden = state.flavor !== &#x27;enterprise&#x27;;
      content.querySelector(&#x27;[data-profile-summary]&#x27;).textContent = empty ? &#x27;Добавьте первый профиль&#x27; : &#x27;2 человека · 1 питомец&#x27;;
      content.querySelector(&#x27;[data-scale-status]&#x27;).textContent = statuses[0];
      content.querySelector(&#x27;[data-health-status]&#x27;).textContent = statuses[1];
      content.querySelector(&#x27;[data-huawei-status]&#x27;).textContent = statuses[2];
      [&#x27;scale&#x27;, &#x27;health&#x27;, &#x27;huawei&#x27;].forEach(kind =&gt; {
        const mark = content.querySelector(`[data-${kind}-mark]`);
        if (!mark) return;
        const successful = state.data === &#x27;ready&#x27;;
        mark.classList.toggle(&#x27;success&#x27;, successful);
        mark.classList.toggle(&#x27;warning&#x27;, !successful);
        mark.innerHTML = successful ? &#x27;&lt;i data-lucide=&quot;circle-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27; : &#x27;&lt;i data-lucide=&quot;circle-alert&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&#x27;;
      });
    }

    if (state.screen === &#x27;profiles&#x27;) {
      const empty = state.data === &#x27;empty&#x27;;
      content.querySelectorAll(&#x27;.populated-profiles&#x27;).forEach(element =&gt; element.hidden = empty);
      content.querySelectorAll(&#x27;.empty-profiles&#x27;).forEach(element =&gt; element.hidden = !empty);
      if (state.textScale === &#x27;large&#x27; &amp;&amp; !empty) {
        const names = content.querySelectorAll(&#x27;.profile-list .row-copy strong&#x27;);
        if (names[0]) names[0].textContent = &#x27;Александр Константинопольский&#x27;;
        if (names[1]) names[1].textContent = &#x27;Мария Александровна Смирнова&#x27;;
      }
    }

    if (state.screen === &#x27;backup&#x27;) {
      const status = content.querySelector(&#x27;[data-backup-status]&#x27;);
      const messages = {
        checking: &#x27;Подготовка резервной копии…&#x27;,
        unavailable: &#x27;Хранилище временно недоступно&#x27;,
        error: &#x27;Не удалось завершить операцию. Можно повторить попытку.&#x27;
      };
      status.hidden = !messages[state.data];
      status.textContent = messages[state.data] || &#x27;&#x27;;
    }

    if (state.screen.endsWith(&#x27;-detail&#x27;)) {
      const variants = {
        &#x27;scale-detail&#x27;: {
          ready: [&#x27;Весы&#x27;, &#x27;Подключено&#x27;, &#x27;Mi Body Composition Scale 2&#x27;, &#x27;Готово к измерению&#x27;, null, &#x27;Забыть выбранные весы&#x27;],
          empty: [&#x27;Весы&#x27;, &#x27;Не выбраны&#x27;, &#x27;Устройство не выбрано&#x27;, &#x27;Выберите весы поблизости&#x27;, &#x27;Выбрать весы&#x27;, null],
          checking: [&#x27;Весы&#x27;, &#x27;Поиск…&#x27;, &#x27;Устройство не выбрано&#x27;, &#x27;Идёт поиск весов&#x27;, &#x27;Поиск весов…&#x27;, null],
          disabled: [&#x27;Весы&#x27;, &#x27;Не выбраны&#x27;, &#x27;Устройство не выбрано&#x27;, &#x27;Выберите весы поблизости&#x27;, &#x27;Выбрать весы&#x27;, null],
          unavailable: [&#x27;Весы&#x27;, &#x27;Bluetooth недоступен&#x27;, &#x27;Устройство не выбрано&#x27;, &#x27;Включите Bluetooth и разрешите поиск&#x27;, &#x27;Открыть настройки Bluetooth&#x27;, null],
          error: [&#x27;Весы&#x27;, &#x27;Ошибка поиска&#x27;, &#x27;Устройство не выбрано&#x27;, &#x27;Не удалось найти весы&#x27;, &#x27;Повторить поиск&#x27;, null]
        },
        &#x27;health-detail&#x27;: {
          ready: [&#x27;Health Connect&#x27;, &#x27;Подключено&#x27;, &#x27;Системная интеграция&#x27;, &#x27;Синхронизация включена&#x27;, &#x27;Открыть Health Connect&#x27;, &#x27;Отключить Health Connect&#x27;],
          empty: [&#x27;Health Connect&#x27;, &#x27;Требуется разрешение&#x27;, &#x27;Системная интеграция&#x27;, &#x27;Предоставьте доступ к данным&#x27;, &#x27;Подключить Health Connect&#x27;, null],
          checking: [&#x27;Health Connect&#x27;, &#x27;Проверка…&#x27;, &#x27;Системная интеграция&#x27;, &#x27;Проверяем доступность и разрешения&#x27;, &#x27;Проверяем…&#x27;, null],

(() =&gt; {

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)

  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
