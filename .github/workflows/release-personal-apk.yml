name: Release APK

on:
  workflow_dispatch:
    inputs:
      expected_version_name:
        description: Expected base versionName (for example, 0.1.20)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: apk-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Confirm release source and version
        id: release
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_VERSION_NAME: ${{ inputs.expected_version_name }}
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "Checked-out commit ${actual_sha} does not match workflow commit ${EXPECTED_SHA}" >&2
            exit 1
          fi

          version_name="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p' app/build.gradle.kts)"
          if [[ -z "${version_name}" || "${version_name}" == *$'\n'* ]]; then
            echo "Expected exactly one base versionName in app/build.gradle.kts" >&2
            exit 1
          fi
          if [[ "${version_name}" != "${EXPECTED_VERSION_NAME}" ]]; then
            echo "Configured versionName ${version_name} does not match confirmed version ${EXPECTED_VERSION_NAME}" >&2
            exit 1
          fi

          echo "version_name=${version_name}" >> "${GITHUB_OUTPUT}"
          echo "commit_sha=${actual_sha}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=apk/${version_name}" >> "${GITHUB_OUTPUT}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Preflight release tag
        id: remote_release
        env:
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
        run: |
          set -euo pipefail

          previous_release_tag="$(.github/scripts/release-apk-tag.sh preflight "${VERSION_NAME}" "${COMMIT_SHA}")"
          echo "previous_release_tag=${previous_release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Build release APK
        run: ./gradlew assembleDebug -PreleaseHistoryMode=release --no-daemon

      - name: Verify and prepare release artifact
        id: artifact
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BASE_VERSION_NAME: ${{ steps.release.outputs.version_name }}
          COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
          PREVIOUS_RELEASE_TAG: ${{ steps.remote_release.outputs.previous_release_tag }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail

          output_dir="app/build/outputs/apk/debug"
          metadata_file="${output_dir}/output-metadata.json"
          variant_version_name="$(jq -er '.elements[0].versionName' "${metadata_file}")"
          version_code="$(jq -er '.elements[0].versionCode' "${metadata_file}")"
          version_name="${variant_version_name}"
          if [[ "${version_name}" != "${BASE_VERSION_NAME}" ]]; then
            echo "APK base version ${version_name} does not match confirmed version ${BASE_VERSION_NAME}" >&2
            exit 1
          fi

          shopt -s nullglob
          apk_files=("${output_dir}"/*.apk)
          if [[ ${#apk_files[@]} -ne 1 ]]; then
            echo "Expected exactly one APK in ${output_dir}, found ${#apk_files[@]}" >&2
            exit 1
          fi

          artifact_dir="build-artifacts"
          artifact_name="ScaleSync-personal-release-${version_name}-run-${RUN_NUMBER}-attempt-${RUN_ATTEMPT}"
          artifact_file="${artifact_name}.apk"
          release_metadata_file="${artifact_name}.json"
          mkdir -p "${artifact_dir}"
          cp "${apk_files[0]}" "${artifact_dir}/${artifact_file}"
          jq --null-input --sort-keys \
            --arg mode "release" \
            --argjson versionCode "${version_code}" \
            --arg baseVersionName "${version_name}" \
            --arg variantVersionName "${variant_version_name}" \
            --arg commitSha "${COMMIT_SHA}" \
            --arg previousReleaseTag "${PREVIOUS_RELEASE_TAG}" \
            --arg releaseTag "${RELEASE_TAG}" \
            '{
              mode: $mode,
              versionCode: $versionCode,
              baseVersionName: $baseVersionName,
              variantVersionName: $variantVersionName,
              commitSha: $commitSha,
              previousReleaseTag: (if $previousReleaseTag == "null" then null else $previousReleaseTag end),
              releaseTag: $releaseTag
            }' > "${artifact_dir}/${release_metadata_file}"

          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=${artifact_dir}" >> "${GITHUB_OUTPUT}"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish annotated APK release tag
        env:
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: .github/scripts/release-apk-tag.sh publish "${VERSION_NAME}" "${COMMIT_SHA}"
