name: Build personal APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build personal debug APK
        run: ./gradlew assemblePersonalDebug --no-daemon

      - name: Prepare APK artifact
        id: artifact
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          output_dir="app/build/outputs/apk/personal/debug"
          metadata_file="${output_dir}/output-metadata.json"
          version_name="$(jq -er '.elements[0].versionName' "${metadata_file}")"

          shopt -s nullglob
          apk_files=("${output_dir}"/*.apk)
          if [[ ${#apk_files[@]} -ne 1 ]]; then
            echo "Expected exactly one APK in ${output_dir}, found ${#apk_files[@]}" >&2
            exit 1
          fi

          artifact_dir="build-artifacts"
          artifact_name="HuaweiMiSync-personal-${version_name}-run-${RUN_NUMBER}-attempt-${RUN_ATTEMPT}"
          artifact_file="${artifact_name}.apk"
          mkdir -p "${artifact_dir}"
          cp "${apk_files[0]}" "${artifact_dir}/${artifact_file}"

          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=${artifact_dir}/${artifact_file}" >> "${GITHUB_OUTPUT}"

      - name: Upload personal APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
